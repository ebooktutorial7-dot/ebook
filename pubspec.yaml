name: ebook_tutorial_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== DB =====
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  speech_to_text: ^7.4.0-beta.8

  # ===== Storage / Path =====
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  path: ^1.9.0
  archive: ^3.6.1

  # ===== Editor / Writing =====
  flutter_quill: ^11.5.0
  flutter_quill_extensions: ^11.0.0
  dart_quill_delta: ^10.8.3
  flex_color_picker: ^3.7.0

  # ===== Firebase =====
  firebase_core: ^3.11.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.0.0

  # ===== Auth / Google APIs =====
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # ===== UI =====
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  provider: ^6.1.5

  # ===== PDF =====
  pdf: ^3.11.0
  printing: ^5.13.4
  pdf_render_maintained: ^1.6.1
  image: ^4.2.0
  characters: ^1.3.0

  # ===== Media / Layout =====
  reorderable_grid_view: ^2.2.8
  image_picker: ^1.2.0

  # ===== Intl =====
  intl: ^0.20.2

  # 공유 기능
  share_plus: ^10.0.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.0
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/fonts/
    - lib/assets/icons/google_g.png

  fonts:
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter/ttf/Inter-Regular.ttf

    - family: NotoSansKR
      fonts:
        - asset: lib/assets/fonts/NotoSansKR-Regular.ttf
        - asset: lib/assets/fonts/NotoSansKR-Bold.ttf

    - family: NotoSansJP
      fonts:
        - asset: lib/assets/fonts/NotoSansJP-Regular.ttf
        - asset: lib/assets/fonts/NotoSansJP-Bold.ttf